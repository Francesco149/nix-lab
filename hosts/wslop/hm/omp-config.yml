# Single-model routing: only DeepSeek V4 Flash is wired up, so every text
# role points at it. Gemini is NOT assigned to a role — it is available for
# manual switching (Ctrl+P / --model) after `omp` → `/login
# google-antigravity` with the Google account that holds the AI Pro
# subscription (OAuth, no API key; see WORKDOC 2026-08-17 for the runbook).
# Selectable id: google-antigravity/gemini-3.1-pro (also gemini-3.5-flash,
# gemini-3.6-flash once discovered). The `google` provider (GEMINI_API_KEY)
# is the metered API and NOT the subscription route.
# (tiny is deliberately unset — it is the local on-device
# role for titles/memory; `omp tiny-models download` won't burn API credits.
# defaultThinkingLevel: high is DeepSeek V4's minimum thinking tier (model
# thinking.minLevel) and the level sentdex benched. Say "ultrathink" in a
# turn to push it to xhigh (DeepSeek "max") on demand.
#
# startup.setupWizard: false — the first-run wizard is disabled so it can't
# 400/crash against a config it can't persist. startup.quiet suppresses the
# startup chrome.
startup:
  quiet: true
  setupWizard: false
modelRoles:
  default: deepseek/deepseek-v4-flash
  smol: deepseek/deepseek-v4-flash
  slow: deepseek/deepseek-v4-flash
  plan: deepseek/deepseek-v4-flash
  commit: deepseek/deepseek-v4-flash
  task: deepseek/deepseek-v4-flash
  vision: openrouter/qwen/qwen3.7-flash
defaultThinkingLevel: high