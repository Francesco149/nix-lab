# DeepSeek V4 Flash provider for omp. A custom entry is REQUIRED because
# the built-in deepseek provider lacks the compat block below, which is what
# prevents 400s when DeepSeek V4 uses tools in thinking mode.
# Reference: https://api-docs.deepseek.com/quick_start/agent_integrations/oh_my_pi
providers:
  deepseek:
    baseUrl: https://api.deepseek.com
    api: openai-completions
    apiKey: DEEPSEEK_API_KEY
    authHeader: true
    models:
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        reasoning: true
        thinking:
          minLevel: high
          maxLevel: xhigh
          mode: effort
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          reasoningEffortMap:
            high: high
            xhigh: max
          supportsToolChoice: false
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
          extraBody:
            thinking:
              type: enabled

  # Local vision on lame (7800XT, gpu-switch `vision` preset, port 8080).
  # Fallback for inspect_image when OpenRouter is down; model id must match
  # the preset's --alias.
  lame-vision:
    baseUrl: http://10.0.10.56:8080/v1
    auth: none
    api: openai-completions
    models:
      - id: qwen3.5-9b
        name: Qwen3.5 9B (lame vision)
        input: [text, image]
        contextWindow: 32768
        maxTokens: 8192
        compat:
          supportsToolChoice: false
          supportsUsageInStreaming: false

  # OpenRouter qwen3.7-flash — the DEFAULT vision model (key in
  # ~/.omp/agent/.env as OPENROUTER_API_KEY, same pattern as the DeepSeek key).
  # Cheapest per-request of the tested vision models (2026-08-14 bench: 6x
  # cheaper than qwen3.5-9b at equal quality; it tokenizes large images at
  # ~2530 tok vs qwen3.5-9b's ~5785). If it fails (credit/outage), fall back
  # to the `vision` CLI which handles the lame wake/switch protocol.
  openrouter:
    baseUrl: https://openrouter.ai/api/v1
    api: openai-completions
    apiKey: OPENROUTER_API_KEY
    authHeader: true
    models:
      - id: qwen/qwen3.7-flash
        name: Qwen3.7 Flash (OpenRouter)
        reasoning: false
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 8192
        cost:
          input: 0.03
          output: 0.13
          cacheRead: 0
          cacheWrite: 0
        compat:
          supportsReasoningEffort: false
          supportsUsageInStreaming: false