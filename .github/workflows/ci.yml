name: CI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  template-tests:
    name: Native Tool Template & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-template-${{ runner.os }}-${{ hashFiles('templates/raylib/flake.lock', 'templates/raylib/flake.nix') }}
          restore-prefixes-first-match: nix-template-${{ runner.os }}-
          gc-max-store-size-linux: 6G

      - name: Scaffold & Verify Native Creation Tool
        run: |
          python3 utils/scaffold-native-app.py /tmp/ci-test-tool --name "CiTestTool" --desc "Continuous Integration Verification Tool"
          cd /tmp/ci-test-tool
          
          echo "=== 1. Headless Unit & Binding Checks (Linux) ==="
          nix develop --command make -C editor test
          
          echo "=== 2. Standalone Linux Packaging ==="
          nix develop --command make -C editor package-linux zip-linux
          
          echo "=== 3. Primary Nix Package Derivation ==="
          nix build --no-link --print-out-paths
          
          echo "=== 4. Windows MinGW Cross Builds (OpenGL & Direct3D 11) ==="
          nix develop --command make -C editor win win-d3d11 package package-d3d11 zip-win zip-d3d11

      - name: Upload Standalone Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-distributions
          path: |
            /tmp/ci-test-tool/build/*.zip
